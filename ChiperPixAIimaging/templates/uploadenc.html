<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../static/styles/style.css">
    <title>Upload Image</title>
</head>

<body>
    <div class="container" style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <section style="height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div style="text-align: center; background-color: #1c1e21; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
                <h2 style="color: #f5f5f5; font-size: 1.8rem; font-family: 'Roboto', sans-serif; margin-bottom: 1.5rem;">Upload Your File for Encryption</h2>
                <form method="POST" action="/uploadenc/" enctype="multipart/form-data">
                    <label for="file-uploader" style="display: inline-block; background-color: #ff4d4d; color: white; padding: 0.8rem 2rem; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1rem;">
                        Choose File
                    </label>
                    <input type="file" name="file" id="file-uploader" style="display: none;">
                    <input type="submit" value="Submit" style="margin-top: 1rem; background-color: #007bff; color: white; padding: 0.8rem 2rem; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;">
                </form>
            </div>
            <p id="feedback" style="text-align: center; font-weight: 500; color: aliceblue; font-size: 1.5rem; margin-top: 1.5rem;"></p>
        </section>
        <footer style="text-align: center; font-size: 1.3rem; font-weight: 400; color: rgb(0, 0, 0); margin-top: 3rem;">
            Made with Precision
        </footer>
    </div>
</body>

<script src="../static/functions.js"></script>

</html>
